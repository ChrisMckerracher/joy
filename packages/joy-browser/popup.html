<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --dim: #6e6e73; --bg: #fff; --card: #f5f5f7; --line: #d2d2d7; --accent: #0a66d8; --ok: #1d8a3a; --bad: #c4271b; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --dim: #a1a1a6; --bg: #1c1c1e; --card: #2c2c2e; --line: #3a3a3c; --accent: #4c9bff; --ok: #32d158; --bad: #ff6961; } }
  body { margin: 0; width: 360px; font: 13px/1.45 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { padding: 14px; display: grid; gap: 12px; }
  h1 { font-size: 14px; margin: 0; } p { margin: 0; color: var(--dim); }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
  input[type=text], input[type=password] { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 7px 12px; background: var(--accent); color: #fff; cursor: pointer; }
  button.quiet { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .err { color: var(--bad); } .ok { color: var(--ok); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 250px; overflow-y: auto; }
  li { background: var(--card); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 1px; }
  li:hover { outline: 1px solid var(--accent); } li.off { opacity: .55; }
  .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 10px; border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; margin-left: 4px; color: var(--dim); }
  pre { margin: 0; font: 11px/1.4 ui-monospace, Menlo, monospace; color: var(--dim); background: var(--card); border-radius: 8px; padding: 8px; max-height: 120px; overflow: auto; white-space: pre-wrap; }
  .check { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body><main id="app"></main><script type="module" src="popup.js"></script></body>
</html>
